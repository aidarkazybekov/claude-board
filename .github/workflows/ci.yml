name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Self-test
        run: CLAUDEBOARD_DATA_DIR="$(mktemp -d)" .build/debug/ClaudeBoard --selftest
      - name: Build app bundle (release)
        run: scripts/build-app.sh --no-install
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBoard-app
          path: build/ClaudeBoard.app
          retention-days: 7
